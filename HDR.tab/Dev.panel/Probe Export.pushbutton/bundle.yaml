title: Probe\nExport
tooltip: >-
  DIAGNOSTIC, READ-ONLY. Reads the model and writes a few test PDFs to a temp
  folder to confirm how Revit names exported files, whether this project uses
  Sheet Collections, and how long per-sheet export takes. Opens no transaction,
  modifies nothing, and never touches your project folders -- safe on a live
  workshared model. Worth running first on a project type or Revit version this
  suite has not seen before; send the output to the maintainer.
author: HDR
min_revit_version: 2025
