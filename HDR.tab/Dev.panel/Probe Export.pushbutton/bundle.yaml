title: |-
  Probe
  Export
tooltip: |-
  Read-only diagnostic. Reports how Revit names exported files, whether this
  project uses Sheet Collections, and how long per-sheet export takes.

  Opens no transaction, changes nothing, and writes only to a temp folder --
  safe to run on a live workshared model.

  Worth running on a project type or Revit version this suite has not seen
  before. Send the output to the maintainer.
author: HDR
help_url: https://github.com/JamesPetry/PyrevitTool/blob/main/docs/SETUP.md#4-run-the-probe
min_revit_version: 2025
