title: |-
  Seed
  Revisions
tooltip: |-
  Modifies your model -- the only button in this suite that does.

  Creates two test revisions and spreads them across the first few sheets,
  leaving some on the older revision and one with none, so Export Issue has a
  realistic mix to work with.

  For sample and scratch models only, never live project work. It asks for
  confirmation first, and one Ctrl+Z undoes all of it.
author: HDR
help_url: https://github.com/JamesPetry/PyrevitTool/blob/main/docs/SETUP.md
min_revit_version: 2025
