title: Archive\nSuperseded
tooltip: |-
  Leaves Exports/ holding only the current revision of each sheet, moving
  everything it supersedes into a dated Archive folder.

  Supersession is worked out per sheet, so A101 moving to P04 does not disturb
  A102 still at P03. Files are moved, never deleted, and only files matching
  the HDR naming convention are touched -- anything else is left alone.

  A review table lists every move before anything happens.
author: HDR
help_url: https://github.com/JamesPetry/PyrevitTool/blob/main/docs/KNOWN-LIMITATIONS.md
min_revit_version: 2025
